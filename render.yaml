databases:
  - name: techflex-db
    databaseName: techflex
    user: techflex
    plan: free
    region: frankfurt

services:
  - type: web
    name: techflex-boutique
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: TechFlex Boutique
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # Transitoire : sera remplacé par un secret Render dès que l'accès API est fourni.
      - key: APP_KEY
        value: base64:Ospy7QMi4EhF8Br+C+a0nL4axD1orvcCgpmG7PBaFZI=
      - key: APP_URL
        value: https://techflex-boutique.onrender.com
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: APP_TIMEZONE
        value: Africa/Porto-Novo
      - key: BCRYPT_ROUNDS
        value: 12
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: techflex-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: TECHFLEX_DELIVERY_PHONE
        value: "22900000000"
      - key: TECHFLEX_MOMO_SIMULATION
        value: true
      - key: TECHFLEX_SEED_DEMO
        value: "false"
